<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Collaborativo UNIPR</title>

    <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/vendor/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">WIKI UNIPR</a>
            <div class="d-flex">
                <button class="btn btn-outline-light me-2" id="btn-login">Login</button>
                <button class="btn btn-primary" id="btn-register">Registrati</button>
            </div>
        </div>
    </nav>
	
    <div class="container-fluid">
        <div class="row">

            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse border-end vh-100">
                <div class="position-sticky pt-3 px-3">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Cerca Appunti</label>
                        <input type="text" class="form-control" id="search-input" placeholder="Cerca un titolo">
                    </div>
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase">
                        <span>Corsi Disponibili</span>
                    </h6>
                    <div class="list-group list-group-flush" id="courses-list">
                        <div class="placeholder-glow">
                            <span class="placeholder col-12"></span>
                            <span class="placeholder col-12"></span>
                        </div>
                    </div>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
                <div id="main-content">
                    <div class="text-center py-5">
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastPlacement" style="z-index: 9999;">
    </div>
    
    <script src="js/vendor/jquery-3.6.0.min.js"></script>
    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/Patterns/EventEmitter.js"></script>
    <script src="js/Model/AppModel.js"></script>
    <script src="js/View/BaseView.js"></script>
    <script src="js/View/NoteView.js"></script>
    <script src="js/View/AuthView.js"></script>
    <script src="js/View/AdminView.js"></script>
    <script src="js/View/AppView.js"></script>
    <script src="js/Presenter/AdminPresenter.js"></script>  
    <script src="js/Presenter/AppPresenter.js"></script>  
	<script src="js/app.js"></script>

</body>
</html>
