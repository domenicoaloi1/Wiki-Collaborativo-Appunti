<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Collaborativo UNIPR</title>
	<!-- ricorda scaricare pack -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


	<h1>Stato Connessione Wiki</h1>
    <div id="status-box" style="padding: 20px; border: 1px solid #ccc;">
        Attendendo risposta dal backend...
    </div>
	
	<script>
        // Chiamata diretta al backend sulla porta 8000
        fetch('http://localhost:8000')
            .then(response => response.json())
            .then(data => {
                const box = document.getElementById('status-box');
                box.innerHTML = `<strong>${data.message}</strong><br>Ricevuto alle: ${data.timestamp}`;
                box.style.backgroundColor = '#d4edda';
            })
            .catch(error => {
                document.getElementById('status-box').innerHTML = "ERRORE: Backend non raggiungibile sulla porta 8000";
                document.getElementById('status-box').style.backgroundColor = '#f8d7da';
                console.error('Errore:', error);
            });
    </script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">WIKI UNIPR</a>
            <div class="d-flex">
                <button class="btn btn-outline-light me-2" id="btn-login">Login</button>
                <button class="btn btn-primary" id="btn-register">Registrati</button>
            </div>
        </div>
    </nav>
	
    <div class="container-fluid">
        <div class="row">
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
                <div id="main-content">
                    <div class="text-center py-5">
                        <h1 class="display-4 fw-bold">Benvenuto su Wiki UNIPR</h1>
                        <p class="lead text-muted">La piattaforma collaborativa per condividere e consultare appunti universitari.</p>
                        <hr class="my-4" style="width: 50%; margin: auto;">
                        <p>Seleziona un corso dalla lista a sinistra per iniziare a esplorare gli argomenti.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>
	<!-- ricorda scaricare pack -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="js/app.js"></script>

</body>
</html>
