services: # docker-compose.yml
  # CONTAINER DB
  db:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
      # Script di init
      - ./services/database/configs:/docker-entrypoint-initdb.d
    # Pronto solo quando MySQL accetta connessioni TCP: -h 127.0.0.1 (non localhost/socket)
    # evita il falso "healthy" durante il server temporaneo che esegue gli script di init
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  # CONTAINER BE (PHP + Apache)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.be
    env_file:
      - .env
    ports: # PC-HOST:8000 ---> CONTAINER:80
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # CONTAINER FE (Apache)
  frontend:
    image: httpd:alpine
    ports: # localhost:8080 ---> CONTAINER:80
      - "8080:80"
    volumes:
      - ./frontend:/usr/local/apache2/htdocs/
      
volumes:
    db_data:
